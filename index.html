<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2تاريخ ووقت السعودية</title>
    <!-- استدعاء خط "تجوال" للنصوص العربية، وخط "JetBrains Mono" للأرقام ليعطي نفس طابع الصورة (أصفار مميزة) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #080808; /* أسود عميق مطابق للصورة */
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
        }
        .font-numbers {
            font-family: 'JetBrains Mono', monospace;
            /* خيار لضمان ظهور الأرقام بشكل متساوٍ وواضح */
            font-variant-numeric: tabular-nums; 
        }
        .time-text {
            font-size: 5rem; /* حجم ضخم للساعة */
            line-height: 1;
            letter-spacing: 0.05em;
        }
        @media (min-width: 768px) {
            .time-text {
                font-size: 6.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-gray-800">

    <!-- المحتوى الرئيسي -->
    <div class="flex flex-col items-center justify-center w-full max-w-md px-4 z-10">
        
        <!-- اليوم -->
        <div class="text-center mb-10 flex flex-col items-center">
            <div id="dayAr" class="text-3xl md:text-4xl font-bold mb-4 text-white">
                --
            </div>
            <div id="dayEn" class="text-xs md:text-sm text-[#737373] tracking-[0.35em] uppercase font-numbers" dir="ltr">
                --
            </div>
        </div>

        <!-- الساعة -->
        <div class="text-center mb-10 flex flex-col items-center">
            <div id="time" class="time-text font-numbers font-light text-white mb-5" dir="ltr">
                00:00:00
            </div>
            <div id="ampm" class="text-sm md:text-base text-[#737373] tracking-[0.3em] font-numbers uppercase" dir="ltr">
                --
            </div>
        </div>

        <!-- الخط الفاصل -->
        <div class="w-full max-w-[280px] h-[1px] bg-[#1f1f1f] mb-10"></div>

        <!-- التواريخ -->
        <div class="text-center space-y-5 flex flex-col items-center">
            <!-- التاريخ الميلادي -->
            <div id="dateGregorian" class="text-2xl md:text-3xl font-numbers font-light tracking-[0.15em] text-[#e5e5e5]" dir="ltr">
                ----/--/--
            </div>
            
            <!-- التاريخ الهجري -->
            <div class="text-[15px] md:text-base text-[#737373] flex items-center justify-center gap-2">
                <span class="font-bold text-[#555555] mt-1">هـ</span>
                <span id="dateHijri" class="font-numbers tracking-[0.15em]" dir="ltr">
                    ---- / -- / --
                </span>
            </div>
        </div>

    </div>

    <!-- تذييل الصفحة (الموقع) -->
    <div class="absolute bottom-10 text-[10px] md:text-xs text-[#404040] tracking-[0.4em] uppercase font-numbers z-10" dir="ltr">
        RIYADH, KSA
    </div>

    <script>
        function updateClockAndDate() {
            const now = new Date();
            // تحديد المنطقة الزمنية للسعودية لضمان الدقة
            const timeZone = 'Asia/Riyadh';

            // 1. حساب الوقت
            const timeParts = new Intl.DateTimeFormat('en-US', { 
                timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            }).formatToParts(now);
            
            const hours = timeParts.find(p => p.type === 'hour').value;
            const minutes = timeParts.find(p => p.type === 'minute').value;
            const seconds = timeParts.find(p => p.type === 'second').value;
            const ampm = timeParts.find(p => p.type === 'dayPeriod').value.toUpperCase();

            document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;
            document.getElementById('ampm').innerText = ampm;

            // 2. اليوم (عربي وإنجليزي)
            document.getElementById('dayAr').innerText = new Intl.DateTimeFormat('ar-SA', { timeZone, weekday: 'long' }).format(now);
            document.getElementById('dayEn').innerText = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'long' }).format(now);

            // 3. التاريخ الميلادي (YYYY/MM/DD)
            const gregParts = new Intl.DateTimeFormat('en-US', { 
                timeZone, year: 'numeric', month: '2-digit', day: '2-digit' 
            }).formatToParts(now);
            
            const gYear = gregParts.find(p => p.type === 'year').value;
            const gMonth = gregParts.find(p => p.type === 'month').value;
            const gDay = gregParts.find(p => p.type === 'day').value;
            
            document.getElementById('dateGregorian').innerText = `${gYear}/${gMonth}/${gDay}`;

            // 4. التاريخ الهجري (YYYY / MM / DD) بتقويم أم القرى الدقيق
            const hijriParts = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { 
                timeZone, year: 'numeric', month: '2-digit', day: '2-digit' 
            }).formatToParts(now);
            
            const hYear = hijriParts.find(p => p.type === 'year').value;
            const hMonth = hijriParts.find(p => p.type === 'month').value;
            const hDay = hijriParts.find(p => p.type === 'day').value;
            
            document.getElementById('dateHijri').innerText = `${hYear} / ${hMonth} / ${hDay}`;
        }

        // التحديث الفوري عند تحميل الصفحة
        updateClockAndDate();

        // تحديث كل ثانية
        setInterval(updateClockAndDate, 1000);
    </script>
</body>
</html>
